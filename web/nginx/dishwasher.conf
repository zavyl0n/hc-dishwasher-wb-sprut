# Страница посудомойки: http://<адрес контроллера>/dishwasher/
# Файл кладётся в /etc/nginx/includes/default.wb.d/ — эту папку подключает штатный сайт Wiren Board.
# Свой location нужен, чтобы браузер не держал у себя старые .js и .css после обновления:
# общий location контроллера отдаёт статику с годовым сроком хранения.
location = /dishwasher {
    return 301 /dishwasher/;
}

location ^~ /dishwasher/ {
    alias /var/www/static/dishwasher/;
    index index.html;
    add_header Cache-Control "no-cache";
}
