name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Зависимости
        run: |
          npm install --no-audit --no-fund
          python -m pip install --require-hashes -r hcpy_wb7/requirements-wb7.txt
      - name: Правило wb-rules (эмулятор)
        run: node --test tests/*.test.js
      - name: Генератор, hc_check, стык с hcpy
        run: python -m unittest discover -s tests -v
      - name: Установщик (shellcheck)
        run: shellcheck hcpy_wb7/install_hcpy.sh tests/real_install.sh

  # правило в настоящем Duktape — движке wb-rules (ES5)
  duktape:
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Moscow
      DUKTAPE: "2.7.0"
      DUKTAPE_SHA256: 90f8d2fa8b5567c6899830ddef2c03f3c27960b11aca222fa17aa7ac613c2890
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Duktape
        run: |
          curl -fsSL --retry 3 -o duktape.tar.xz \
            "https://github.com/svaarala/duktape/releases/download/v$DUKTAPE/duktape-$DUKTAPE.tar.xz"
          echo "$DUKTAPE_SHA256  duktape.tar.xz" | sha256sum -c -
          tar xJf duktape.tar.xz
          make -s -C "duktape-$DUKTAPE" -f Makefile.cmdline
      - name: Правило в Duktape
        run: |
          for rule in rule/dishwasher.js examples/SMV4HVX31E/dishwasher.js; do
            echo "== $rule"
            "duktape-$DUKTAPE/duk" tests/duktape/harness.js "$rule" tests/duktape/smoke.js
          done

  # make_kit.py обещает работу на старом системном Python контроллера
  generator-old-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m unittest tests.test_make_kit -v
